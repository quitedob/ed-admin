<!DOCTYPE html>
<html>
<head>
    <title>权限测试</title>
</head>
<body>
    <h1>权限测试</h1>
    <p>打开浏览器控制台查看登录时的权限信息</p>
    <ol>
        <li>以班主任身份登录</li>
        <li>查看控制台输出的权限列表</li>
        <li>确认是否包含 'data:global-view'</li>
    </ol>
    
    <h2>预期结果：</h2>
    <ul>
        <li>管理员：权限包含 '*'</li>
        <li>班主任：权限包含 'data:global-view'</li>
        <li>老师：权限包含 'data:personal-view'</li>
    </ul>
</body>
</html>
